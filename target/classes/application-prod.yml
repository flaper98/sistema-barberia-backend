spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080

logging:
  level:
    com.barberia: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: ERROR
  file:
    name: logs/barberia-backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
