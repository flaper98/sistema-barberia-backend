    expiration: 86400000
    refresh-expiration: 604800000
  cors:
    allowed-origins: "*"
  security:
    encryption-key: "lYas6PllS/jXzrs2BDwEa9Ok4giQ5jTb3pGXJA1x17s="

logging:
  level:
    com.barberia: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: ERROR
  file:
    name: logs/barberia-backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
